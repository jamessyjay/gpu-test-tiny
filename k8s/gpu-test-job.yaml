apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-acceptance-job
spec:
  # Adjust how many pods run at the same time (e.g. 1 .. number-of-nodes)
  parallelism: 64
  # How many pods must complete successfully in total
  completions: 64
  backoffLimit: 0
  completionMode: NonIndexed
  template:
    metadata:
      labels:
        app: gpu-acceptance-job
    spec:
      restartPolicy: OnFailure
      # Ensure we spread pods one-per-node when possible
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: gpu-acceptance-job
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: gpu-acceptance-job
            topologyKey: kubernetes.io/hostname
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: runner
        image: ghcr.io/jamessyjay/gpu-cluster-acceptance:tiny
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh","-lc"]
        args:
          - >
            python /app/src/gpu_accept_cuda_so.py
            --log-level ${LOG_LEVEL}
            --report-dir ${REPORT_DIR}
            --report-name gpu_accept_${NODE_NAME}_${POD_NAME}.json
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: REPORT_DIR
          value: "/reports"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NCCL_IB_DISABLE
          value: "0"
        - name: NCCL_DEBUG
          value: "INFO"
        # Optional: specify interfaces/HCAs if needed
        # - name: NCCL_SOCKET_IFNAME
        #   value: "eth0"
        # - name: NCCL_IB_HCA
        #   value: "mlx5_0,mlx5_1"
        resources:
          # Adjust GPU per pod. For one-pod-per-node and full-node testing set to 8; for lightweight spread set to 1.
          requests:
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: reports
          mountPath: /reports
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: reports
        hostPath:
          path: /var/log/gpu-acceptance
          type: DirectoryOrCreate
