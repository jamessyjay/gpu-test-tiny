name: Build and Test

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nv-tiny
          push: true
          tags: ghcr.io/${{ github.repository }}:tiny

      - name: Detect NVIDIA runtime on runner
        id: gpu_check
        run: |
          echo "Checking for NVIDIA runtime in Docker..."
          if docker info --format '{{json .Runtimes}}' | grep -qi nvidia; then
            echo "has_gpu=true" >> $GITHUB_OUTPUT
          else
            echo "has_gpu=false" >> $GITHUB_OUTPUT
          fi

      - name: Run GPU Test
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.base.ref == github.ref) && steps.gpu_check.outputs.has_gpu == 'true' }}
        run: |
          echo "Run GPU Test"
          docker run --gpus all ghcr.io/${{ github.repository }}:tiny python /app/src/gpu_accept_cuda_so.py

      - name: Skip GPU Test (no NVIDIA runtime on runner)
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.base.ref == github.ref) && steps.gpu_check.outputs.has_gpu != 'true' }}
        run: |
          echo "Skipping GPU Test: no NVIDIA runtime available on this runner. Build succeeded."
